name: Bug report
description: Report a reproducible problem so it can be investigated and fixed in an update.
body:
  - type: markdown
    attributes:
      value: "Remove all secrets and private customer data. Use private security reporting for vulnerabilities."
  - type: input
    id: version
    attributes: {label: TartGram version}
    validations: {required: true}
  - type: dropdown
    id: login
    attributes:
      label: Meta login mode
      options: [Unified Login, Existing Instagram Login, Not connected]
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps, description: Include expected and actual behavior.}
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes: {label: Sanitized diagnostics, description: Status codes and short redacted logs only.}
